<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заједница Читалаца - Каталог књига</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Заједница Читалаца</a>
            <ul class="nav-links">
                <li><a href="index.html">Књиге</a></li>
                <li><a href="authors.html">Аутори</a></li>
                <li><a href="profile.html">Профил</a></li>
                <li><a href="admin-books.html">Админ књиге</a></li>
                <li><a href="admin-authors.html">Админ аутори</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>Каталог књига</h1>
        <section class="card filter-card">
            <h2>Претрага књига</h2>
            <form class="filter-form" data-book-search novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="book-search-title">Назив књиге:</label>
                        <input id="book-search-title" name="title" type="search" placeholder="Нпр. Фауст">
                    </div>
                    <div class="form-group">
                        <label for="book-search-genre">Жанр:</label>
                        <input id="book-search-genre" name="genre" type="search" placeholder="Нпр. класика">
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" type="submit">Претражи</button>
                    <button class="btn btn-secondary" type="button" data-book-search-reset>Очисти</button>
                </div>
            </form>
        </section>
        <p class="page-intro" data-books-result-summary></p>
        <div class="grid" data-books-grid></div>
    </main>
    <footer>
        <p>Заједница Читалаца — Пројекат из веб дизајна 2026</p>
    </footer>
    <script src="js/shared.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/student1-books.js"></script>
</body>
</html>
