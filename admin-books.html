<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заједница Читалаца - Администрација књига</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Заједница Читалаца</a>
            <ul class="nav-links">
                <li><a href="index.html">Књиге</a></li>
                <li><a href="authors.html">Аутори</a></li>
                <li><a href="profile.html">Профил</a></li>
                <li><a href="admin-books.html">Админ књиге</a></li>
                <li><a href="admin-authors.html">Админ аутори</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>Администрација књига</h1>
        <div class="grid admin-grid">
            <div class="card admin-card">
                <h3>Додај нову књигу</h3>
                <p class="status-message hidden" data-book-form-message="add"></p>
                <form class="book-form" data-book-form="add" novalidate>
                    <div class="form-group">
                        <label for="book-title">Наслов књиге:</label>
                        <input type="text" id="book-title" name="title" placeholder="Унесите наслов">
                        <small class="field-error" data-error-for="title"></small>
                    </div>
                    <div class="form-group">
                        <label for="book-description">Опис:</label>
                        <textarea id="book-description" name="description" rows="3" placeholder="Кратак опис књиге"></textarea>
                        <small class="field-error" data-error-for="description"></small>
                    </div>
                    <div class="form-group">
                        <label for="book-image">Слика:</label>
                        <input type="text" id="book-image" name="image" placeholder="images/naziv-slike.jpg">
                        <small class="field-error" data-error-for="image"></small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-genre">Жанр:</label>
                            <input type="text" id="book-genre" name="genre" placeholder="Нпр. класика">
                            <small class="field-error" data-error-for="genre"></small>
                        </div>
                        <div class="form-group">
                            <label for="book-format">Формат:</label>
                            <input type="text" id="book-format" name="format" placeholder="Меки или тврди повез">
                            <small class="field-error" data-error-for="format"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-price">Цена:</label>
                            <input type="number" id="book-price" name="price" min="1" placeholder="1200">
                            <small class="field-error" data-error-for="price"></small>
                        </div>
                        <div class="form-group">
                            <label for="book-pages">Број страна:</label>
                            <input type="number" id="book-pages" name="pages" min="1" placeholder="300">
                            <small class="field-error" data-error-for="pages"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-author-id">ID аутора:</label>
                            <input type="text" id="book-author-id" name="authorId" placeholder="aut001">
                            <small class="field-error" data-error-for="authorId"></small>
                        </div>
                        <div class="form-group">
                            <label for="book-isbn">ISBN:</label>
                            <input type="text" id="book-isbn" name="isbn" placeholder="978-86-7543-123-4">
                            <small class="field-error" data-error-for="isbn"></small>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Сачувај</button>
                </form>
            </div>

            <div class="card admin-card">
                <h3>Измени књигу</h3>
                <p class="status-message hidden" data-book-form-message="edit"></p>
                <form class="book-form" data-book-form="edit" novalidate>
                    <div class="form-group">
                        <label for="edit-title">Наслов књиге:</label>
                        <input type="text" id="edit-title" name="title">
                        <small class="field-error" data-error-for="title"></small>
                    </div>
                    <div class="form-group">
                        <label for="edit-description">Опис:</label>
                        <textarea id="edit-description" name="description" rows="3"></textarea>
                        <small class="field-error" data-error-for="description"></small>
                    </div>
                    <div class="form-group">
                        <label for="edit-image">Слика:</label>
                        <input type="text" id="edit-image" name="image">
                        <small class="field-error" data-error-for="image"></small>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-genre">Жанр:</label>
                            <input type="text" id="edit-genre" name="genre">
                            <small class="field-error" data-error-for="genre"></small>
                        </div>
                        <div class="form-group">
                            <label for="edit-format">Формат:</label>
                            <input type="text" id="edit-format" name="format">
                            <small class="field-error" data-error-for="format"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-price">Цена:</label>
                            <input type="number" id="edit-price" name="price" min="1">
                            <small class="field-error" data-error-for="price"></small>
                        </div>
                        <div class="form-group">
                            <label for="edit-pages">Број страна:</label>
                            <input type="number" id="edit-pages" name="pages" min="1">
                            <small class="field-error" data-error-for="pages"></small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-author-id">ID аутора:</label>
                            <input type="text" id="edit-author-id" name="authorId">
                            <small class="field-error" data-error-for="authorId"></small>
                        </div>
                        <div class="form-group">
                            <label for="edit-isbn">ISBN:</label>
                            <input type="text" id="edit-isbn" name="isbn">
                            <small class="field-error" data-error-for="isbn"></small>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Ажурирај</button>
                </form>
            </div>
        </div>
        <div class="card admin-card">
            <h3>Листа књига</h3>
            <table>
                <thead>
                    <tr>
                        <th>Наслов</th>
                        <th>Жанр</th>
                        <th>ISBN</th>
                        <th>Акције</th>
                    </tr>
                </thead>
                <tbody data-admin-books></tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>Заједница Читалаца — Пројекат из веб дизајна 2026</p>
    </footer>
    <script src="js/shared.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/student1-books.js"></script>
</body>
</html>
