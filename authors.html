<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заједница Читалаца - Аутори</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="student2-page">
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Заједница Читалаца</a>
            <ul class="nav-links">
                <li><a href="index.html">Књиге</a></li>
                <li><a href="authors.html">Аутори</a></li>
                <li><a href="profile.html">Профил</a></li>
                <li><a href="admin-books.html">Админ књиге</a></li>
                <li><a href="admin-authors.html">Админ аутори</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Аутори</h1>
        <section class="card filter-card">
            <h2>Претрага аутора</h2>
            <form class="filter-form" data-author-search novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="author-search-name">Име или презиме:</label>
                        <input id="author-search-name" name="name" type="search" placeholder="Нпр. Тесла">
                    </div>
                    <div class="form-group">
                        <label for="author-search-status">Статус:</label>
                        <select id="author-search-status" name="status">
                            <option value="">Сви статуси</option>
                            <option value="Активан">Активан</option>
                            <option value="У пензији">У пензији</option>
                            <option value="Преминуо">Преминуо</option>
                        </select>
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" type="submit">Претражи</button>
                    <button class="btn btn-secondary" type="button" data-author-search-reset>Очисти</button>
                </div>
            </form>
        </section>
        <p class="status-message" data-authors-status>Учитавање аутора...</p>
        <p class="page-intro" data-authors-result-summary></p>
        <div class="grid authors-grid" data-authors-grid></div>
    </main>

    <footer>
        <p>Заједница Читалаца - Пројекат из веб дизајна 2026</p>
    </footer>
    <script src="js/shared.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/student2-authors.js"></script>
</body>
</html>
