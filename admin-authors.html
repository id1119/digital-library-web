<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заједница Читалаца - Администрација аутора</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Заједница Читалаца</a>
            <ul class="nav-links">
                <li><a href="index.html">Књиге</a></li>
                <li><a href="authors.html">Аутори</a></li>
                <li><a href="profile.html">Профил</a></li>
                <li><a href="admin-books.html">Админ књиге</a></li>
                <li><a href="admin-authors.html">Админ аутори</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Администрација аутора</h1>

        <div class="grid admin-grid">
            <section class="card admin-card">
                <h2>Додај аутора</h2>
                <p class="status-message hidden" data-author-message="add"></p>
                <form data-author-form="add" novalidate></form>
            </section>

            <section class="card admin-card">
                <h2>Измени аутора</h2>
                <p class="status-message hidden" data-author-message="edit"></p>
                <form data-author-form="edit" novalidate></form>
            </section>
        </div>

        <section class="card admin-card">
            <h2>Листа аутора</h2>
            <p class="status-message" data-admin-authors-status>Учитавање аутора...</p>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Име и презиме</th>
                            <th>Статус</th>
                            <th>Награде</th>
                            <th>Акције</th>
                        </tr>
                    </thead>
                    <tbody data-admin-authors></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Заједница Читалаца - Пројекат из веб дизајна 2026</p>
    </footer>
    <script src="js/shared.js"></script>
    <script src="js/student2-authors.js"></script>
</body>
</html>
