<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заједница Читалаца - Администрација књига</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Заједница Читалаца</a>
            <ul class="nav-links">
                <li><a href="index.html">Књиге</a></li>
                <li><a href="authors.html">Аутори</a></li>
                <li><a href="profile.html">Профил</a></li>
                <li><a href="admin-books.html">Админ књиге</a></li>
                <li><a href="admin-authors.html">Админ аутори</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>Администрација књига</h1>
        <div class="grid" style="grid-template-columns: 1fr 1fr; align-items: start;">
            <div class="card" style="text-align: left; align-items: flex-start;">
                <h3>Додај нову књигу</h3>
                <form style="width: 100%;">
                    <div class="form-group">
                        <label for="book-title">Наслов књиге:</label>
                        <input type="text" id="book-title" placeholder="Унесите наслов">
                    </div>
                    <div class="form-group">
                        <label for="book-author">Аутор:</label>
                        <input type="text" id="book-author" placeholder="Унесите име аутора">
                    </div>
                    <button type="button" class="btn btn-primary">Сачувај</button>
                </form>
            </div>
            <div class="card" style="text-align: left; align-items: flex-start;">
                <h3>Измени књигу</h3>
                <form style="width: 100%;">
                    <div class="form-group">
                        <label for="edit-title">Наслов књиге:</label>
                        <input type="text" id="edit-title" value="На Дрини ћуприја">
                    </div>
                    <div class="form-group">
                        <label for="edit-author">Аутор:</label>
                        <select id="edit-author">
                            <option value="1" selected>Иво Андрић</option>
                            <option value="2">Габор Мате</option>
                            <option value="3">Вук Караџић</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary">Ажурирај</button>
                </form>
            </div>
        </div>
        <div class="card" style="text-align: left; align-items: flex-start;">
            <h3>Листа књига</h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="text-align: left; padding: 0.8rem; border-bottom: 2px solid var(--gray-light);">Наслов</th>
                        <th style="text-align: left; padding: 0.8rem; border-bottom: 2px solid var(--gray-light);">Аутор</th>
                        <th style="text-align: left; padding: 0.8rem; border-bottom: 2px solid var(--gray-light);">Акције</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="padding: 0.8rem; border-bottom: 1px solid var(--gray-light);">На Дрини ћуприја</td>
                        <td style="padding: 0.8rem; border-bottom: 1px solid var(--gray-light);">Иво Андрић</td>
                        <td style="padding: 0.8rem; border-bottom: 1px solid var(--gray-light);">
                            <a href="book-details-cuprija.html" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Детаљи</a>
                            <button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Измени</button>
                            <button class="btn" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; background-color: #ef5350; color: white;">Обриши</button>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 0.8rem; border-bottom: 1px solid var(--gray-light);">Расути умови</td>
                        <td style="padding: 0.8rem; border-bottom: 1px solid var(--gray-light);">Габор Мате</td>
                        <td style="padding: 0.8rem; border-bottom: 1px solid var(--gray-light);">
                            <a href="book-details-umovi.html" class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Детаљи</a>
                            <button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">Измени</button>
                            <button class="btn" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; background-color: #ef5350; color: white;">Обриши</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <p>Заједница Читалаца — Пројекат из веб дизајна 2026</p>
    </footer>
</body>
</html>
